name: Sync LOF data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 20 * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python scripts/sync_lof_data.py --all
      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lof_catalog.json data/lof_holdings.json
          git diff --cached --quiet || git commit -m "data: refresh LOF catalog and holdings"
          git push
