<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金实时估值中心</title>
    <style>
        :root {
            --ink: #17212b;
            --muted: #667085;
            --line: #e6e9ef;
            --paper: #ffffff;
            --canvas: #f3f5f8;
            --brand: #155eef;
            --brand-soft: #eef4ff;
            --up: #d92d20;
            --down: #079455;
            --warn: #b54708;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--canvas);
            font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }
        .shell { max-width: 1240px; margin: 0 auto; padding: 28px 20px 56px; }
        .topbar { margin-bottom: 20px; }
        h1 { margin: 0; font-size: clamp(24px, 4vw, 36px); letter-spacing: -0.04em; }
        .tabs { display: flex; gap: 4px; width: fit-content; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); margin-bottom: 16px; }
        .tab { border: 0; border-radius: 8px; padding: 10px 18px; background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; }
        .tab.active { background: var(--brand); color: white; box-shadow: 0 2px 8px rgba(21,94,239,.22); }
        .panel { display: none; }
        .panel.active { display: block; }
        .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 24px rgba(16,24,40,.04); }
        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
        .toolbar-meta { color: var(--muted); font-size: 13px; }
        button.action { border: 1px solid var(--line); border-radius: 9px; padding: 9px 14px; background: white; color: var(--ink); font-weight: 700; cursor: pointer; }
        button.action:hover { border-color: #b9c1cc; }
        button:disabled { opacity: .55; cursor: wait; }
        .table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; min-width: 1030px; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
        th { background: #fafbfc; color: var(--muted); font-size: 12px; letter-spacing: .02em; }
        th:first-child, td:first-child { text-align: left; }
        tbody tr:hover { background: #fbfcff; }
        .fund-name { color: #344054; font-size: 13px; font-weight: 650; margin-top: 5px; max-width: 340px; white-space: normal; line-height: 1.45; }
        .fund-code-primary { font: 800 20px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .02em; color: var(--ink); }
        .fund-code, .micro { color: var(--muted); font-size: 12px; margin-top: 4px; }
        .number { font: 700 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
        .up { color: var(--up); }
        .down { color: var(--down); }
        .flat { color: var(--muted); }
        .badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 4px 8px; font-size: 11px; font-weight: 700; background: #f2f4f7; color: #475467; margin: 2px; }
        .badge.direct_realtime { background: #ecfdf3; color: #027a48; }
        .badge.proxy { background: #fff6ed; color: #b54708; }
        .badge.eod, .badge.assumed_stable { background: #f2f4f7; color: #475467; }
        .badge.missing { background: #fef3f2; color: #b42318; }
        .coverage { min-width: 112px; }
        .bar { width: 100%; height: 6px; border-radius: 99px; overflow: hidden; background: #eaecf0; margin-top: 6px; }
        .bar > span { display: block; height: 100%; background: var(--brand); }
        .basis-note { display: inline-block; max-width: 170px; color: #475467; font-size: 12px; line-height: 1.5; white-space: normal; text-align: left; }
        .basis-note.caution { color: var(--warn); }
        .composition-toggle { margin-top: 7px; padding: 0; border: 0; background: none; color: var(--brand); font-size: 12px; font-weight: 700; cursor: pointer; }
        .composition-toggle:hover { text-decoration: underline; }
        .composition-row[hidden] { display: none; }
        .composition-row > td { padding: 0; background: #f8faff; white-space: normal; text-align: left; }
        .composition-panel { padding: 18px 20px 20px; border-bottom: 1px solid var(--line); }
        .composition-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
        .composition-title { font-size: 14px; font-weight: 800; }
        .composition-stats { color: var(--muted); font-size: 12px; line-height: 1.6; text-align: right; }
        .composition-note { margin-bottom: 12px; padding: 9px 11px; border-radius: 8px; background: #eef4ff; color: #344054; font-size: 12px; line-height: 1.55; }
        .composition-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
        .composition-grid { display: grid; grid-template-columns: minmax(210px, 1.5fr) 70px 90px 90px minmax(160px, 1.2fr) minmax(150px, 1fr); min-width: 900px; align-items: center; }
        .composition-grid > div { min-width: 0; padding: 9px 11px; border-bottom: 1px solid var(--line); font-size: 12px; line-height: 1.45; }
        .composition-grid:last-child > div { border-bottom: 0; }
        .composition-grid-head { background: #f9fafb; color: var(--muted); font-weight: 700; }
        .composition-grid-head > div { font-size: 11px; }
        .holding-name { font-weight: 700; color: #344054; }
        .holding-meta { margin-top: 3px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
        .notice { margin-top: 14px; color: var(--muted); font-size: 12px; line-height: 1.7; }
        .search-card { padding: clamp(20px, 5vw, 40px); }
        .search-card h2 { margin: 0 0 8px; font-size: 24px; }
        .search-card > p { margin: 0 0 22px; color: var(--muted); }
        .search-row { display: flex; gap: 10px; max-width: 720px; }
        input { width: 100%; border: 1px solid #cfd4dc; border-radius: 10px; padding: 13px 14px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(21,94,239,.12); }
        .primary { border: 0; border-radius: 10px; padding: 13px 22px; background: var(--brand); color: white; font-weight: 800; cursor: pointer; white-space: nowrap; }
        .error { display: none; color: #b42318; background: #fef3f2; padding: 10px 12px; border-radius: 8px; margin-top: 14px; }
        .result { display: none; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 24px; }
        .result-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
        .result h3 { margin: 0 0 5px; font-size: 22px; }
        .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 12px; margin-top: 20px; }
        .metric { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: #fafbfc; }
        .metric-label { color: var(--muted); font-size: 12px; }
        .metric-value { margin-top: 8px; font: 750 22px ui-monospace, SFMono-Regular, Consolas, monospace; }
        details { margin-top: 18px; }
        summary { cursor: pointer; color: var(--brand); font-weight: 700; }
        .detail-list { margin-top: 12px; max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
        .detail-row { display: grid; grid-template-columns: minmax(180px, 1fr) 90px 90px minmax(180px, 1.4fr); gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
        .detail-row:last-child { border-bottom: 0; }
        .skeleton { padding: 30px; text-align: center; color: var(--muted); }
        @media (max-width: 720px) {
            .search-row { flex-direction: column; }
            .metric-grid { grid-template-columns: repeat(2, 1fr); }
            .detail-row { grid-template-columns: 1fr 80px; }
            .detail-row span:nth-child(4) { grid-column: 1 / -1; }
            .composition-head { flex-direction: column; }
            .composition-stats { text-align: left; }
        }
    </style>
</head>
<body>
<main class="shell">
    <header class="topbar">
        <h1>基金实时估值中心</h1>
    </header>

    <nav class="tabs" aria-label="功能切换">
        <button class="tab active" data-panel="dashboardPanel">LOF 看板</button>
        <button class="tab" data-panel="searchPanel">基金搜索</button>
    </nav>

    <section class="panel active" id="dashboardPanel">
        <div class="card">
            <div class="toolbar">
                <div class="toolbar-meta" id="dashboardMeta">正在计算估值与折溢价…</div>
                <button class="action" id="refreshBtn">刷新估值</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>基金代码 / 基金简称</th>
                        <th>实时估值</th>
                        <th>场内价格</th>
                        <th>溢价率</th>
                        <th title="成功取得行情并纳入计算的持仓，占基金净值的比例">已估持仓</th>
                        <th>估值说明</th>
                        <th>净值基准</th>
                    </tr>
                    </thead>
                    <tbody id="dashboardBody"><tr><td colspan="7" class="skeleton">首次估值需要抓取持仓行情，请稍候…</td></tr></tbody>
                </table>
            </div>
        </div>
        <p class="notice">“已估持仓”是成功取得行情并纳入计算的持仓占基金净值的比例。溢价率 = 场内价格 ÷ 实时估值 − 1；正数为溢价，负数为折价。所有结果仅供参考，不构成投资建议。</p>
    </section>

    <section class="panel" id="searchPanel">
        <div class="card search-card">
            <h2>查询基金估值</h2>
            <p>请输入完整的 6 位基金代码或完整基金名称。</p>
            <div class="search-row">
                <input id="searchInput" type="text" maxlength="100" placeholder="例如：160719 或 嘉实黄金（QDII-FOF-LOF）">
                <button class="primary" id="searchBtn">查询估值</button>
            </div>
            <div class="error" id="searchError"></div>
            <div class="result" id="searchResult"></div>
        </div>
    </section>
</main>

<script>
    const QUALITY_LABELS = {
        direct_realtime: '原标的行情', proxy: '相关资产近似', eod: '最近收盘价',
        assumed_stable: '价格暂按不变', missing: '暂缺价格', intraday: '盘中汇率'
    };
    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const num = (value, digits = 4) => value == null ? '—' : Number(value).toFixed(digits);
    const pct = (value) => value == null ? '—' : `${value > 0 ? '+' : ''}${Number(value).toFixed(2)}%`;
    const tone = (value) => value > 0 ? 'up' : value < 0 ? 'down' : 'flat';
    const qualityBadges = (qualities = []) => qualities.map(q => `<span class="badge ${esc(q)}">${esc(QUALITY_LABELS[q] || q)}</span>`).join('');
    const displayTime = (value) => {
        if (!value) return '—';
        const text = String(value).replace('T', ' ');
        return text.length >= 19 ? text.slice(5, 19) : text;
    };
    const estimateBasis = (qualities = []) => {
        if (qualities.includes('missing')) return '部分持仓暂时没有价格';
        const notes = [];
        if (qualities.includes('proxy')) notes.push('部分持仓使用相关资产近似');
        if (qualities.includes('eod')) notes.push('部分持仓使用最近收盘价');
        if (qualities.includes('assumed_stable')) notes.push('债券价格暂按不变');
        return notes.length ? notes.join('；') : '持仓均按原标的行情计算';
    };
    const holdingMethod = (item) => {
        if (item.quality === 'proxy') return `使用 ${item.quote_symbol} 近似${item.proxy_reason ? `：${item.proxy_reason}` : ''}`;
        return QUALITY_LABELS[item.quality] || item.source || item.message || '—';
    };
    const fxDescription = (item) => {
        if (item.currency === 'CNY') return '人民币，无需换汇';
        if (!item.fx_rate) return `${item.currency || '外币'}，汇率暂缺`;
        return `${item.currency}/CNY ${num(item.fx_rate, 4)} · ${displayTime(item.fx_updated_at)}`;
    };
    const renderComposition = (row) => {
        const holdingRows = (row.details || []).map(item => `
            <div class="composition-grid">
                <div><div class="holding-name">${esc(item.name)}</div><div class="holding-meta">${esc(item.symbol)}${item.quote_symbol !== item.symbol ? ` → ${esc(item.quote_symbol)}` : ''}</div></div>
                <div class="number">${num(item.weight, 2)}%</div>
                <div class="number ${tone(item.holding_return_pct)}">${pct(item.holding_return_pct)}</div>
                <div class="number ${tone(item.contribution_pct)}">${pct(item.contribution_pct)}</div>
                <div>${esc(holdingMethod(item))}</div>
                <div>${esc(fxDescription(item))}</div>
            </div>`).join('');
        return `
            <div class="composition-panel">
                <div class="composition-head">
                    <div><div class="composition-title">基金构成与估值贡献</div><div class="micro">最新披露期 ${esc(row.report_period || '未知')}</div></div>
                    <div class="composition-stats">已披露 ${num(row.recorded_weight, 1)}% · 已估 ${num(row.priced_weight, 1)}% · 未披露或未估 ${num(Math.max(0, 100 - Number(row.priced_weight || 0)), 1)}%</div>
                </div>
                <div class="composition-note">已披露持仓按真实权重计入；未披露或未取到价格的部分按 0 收益处理，不把前十大持仓涨跌放大到整个基金。</div>
                <div class="composition-scroll">
                    <div class="composition-grid composition-grid-head"><div>持仓 / 行情代码</div><div>权重</div><div>人民币涨跌</div><div>净值贡献</div><div>如何计价</div><div>汇率与时间</div></div>
                    ${holdingRows || '<div class="skeleton">暂无披露持仓</div>'}
                </div>
            </div>`;
    };

    document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(item => item.classList.toggle('active', item === button));
        document.querySelectorAll('.panel').forEach(panel => panel.classList.toggle('active', panel.id === button.dataset.panel));
    }));

    async function loadDashboard() {
        const button = document.getElementById('refreshBtn');
        button.disabled = true;
        try {
            const response = await fetch('/api/dashboard');
            if (!response.ok) throw new Error('看板接口请求失败');
            const payload = await response.json();
            document.getElementById('dashboardBody').innerHTML = payload.funds.map(row => `
                <tr class="dashboard-row" title="${esc((row.warnings || []).join(' '))}">
                    <td><div class="fund-code-primary">${esc(row.fund_code)}</div><div class="fund-name">${esc(row.fund_name)}</div><button type="button" class="composition-toggle" data-code="${esc(row.fund_code)}" aria-expanded="false">查看构成</button></td>
                    <td><div class="number">${num(row.estimated_nav)}</div><div class="micro ${tone(row.estimated_change_pct)}">${pct(row.estimated_change_pct)}</div></td>
                    <td><div class="number">${num(row.market_price, 3)}</div><div class="micro">${esc(row.market_price_date || '—')}</div></td>
                    <td><div class="number ${tone(row.premium_rate)}">${pct(row.premium_rate)}</div></td>
                    <td class="coverage" title="成功取得行情并纳入计算的持仓，占基金净值的比例"><div class="number">${num(row.priced_weight, 1)}%</div><div class="bar"><span style="width:${Math.min(100, Number(row.priced_weight || 0))}%"></span></div></td>
                    <td><span class="basis-note ${(row.quote_qualities || []).includes('proxy') || (row.quote_qualities || []).includes('missing') ? 'caution' : ''}">${esc(estimateBasis(row.quote_qualities))}</span></td>
                    <td><div>${num(row.base_nav)}</div><div class="micro">${esc(row.base_nav_date || '—')}</div></td>
                </tr>
                <tr class="composition-row" id="composition-${esc(row.fund_code)}" hidden><td colspan="7">${renderComposition(row)}</td></tr>`).join('');
            document.querySelectorAll('.composition-toggle').forEach(toggle => toggle.addEventListener('click', () => {
                const panel = document.getElementById(`composition-${toggle.dataset.code}`);
                const expanded = toggle.getAttribute('aria-expanded') === 'true';
                toggle.setAttribute('aria-expanded', String(!expanded));
                toggle.textContent = expanded ? '查看构成' : '收起构成';
                panel.hidden = expanded;
            }));
            const estimateUpdatedAt = payload.funds.map(row => row.update_time).filter(Boolean).sort().pop();
            document.getElementById('dashboardMeta').textContent = `按溢价率从高到低 · 估值更新 ${displayTime(estimateUpdatedAt)} · 汇率更新 ${displayTime(payload.fx_updated_at)}`;
        } catch (error) {
            document.getElementById('dashboardBody').innerHTML = `<tr><td colspan="7" class="skeleton">${esc(error.message)}</td></tr>`;
        } finally { button.disabled = false; }
    }

    function renderSearchResult(row) {
        return `
            <div class="result-head"><div><div class="fund-code-primary">${esc(row.fund_code)}</div><h3>${esc(row.fund_name)}</h3><div class="fund-code">持仓披露期 ${esc(row.report_period || '未知')} · 汇率更新 ${displayTime(row.fx_updated_at)}</div></div><span class="basis-note ${(row.quote_qualities || []).includes('proxy') ? 'caution' : ''}">${esc(estimateBasis(row.quote_qualities))}</span></div>
            <div class="metric-grid">
                <div class="metric"><div class="metric-label">实时估值</div><div class="metric-value">${num(row.estimated_nav)}</div></div>
                <div class="metric"><div class="metric-label">估算涨跌</div><div class="metric-value ${tone(row.estimated_change_pct)}">${pct(row.estimated_change_pct)}</div></div>
                <div class="metric"><div class="metric-label">场内价格 / 溢价</div><div class="metric-value ${tone(row.premium_rate)}">${row.market_price == null ? '非 LOF' : `${num(row.market_price,3)} / ${pct(row.premium_rate)}`}</div></div>
                <div class="metric"><div class="metric-label">已估持仓</div><div class="metric-value">${num(row.priced_weight,1)}%</div></div>
            </div>
            <p class="notice">${esc((row.warnings || []).join(' '))}</p>
            <details><summary>查看基金构成（${(row.details || []).length} 项）</summary>${renderComposition(row)}</details>`;
    }

    async function searchFund() {
        const input = document.getElementById('searchInput');
        const button = document.getElementById('searchBtn');
        const errorBox = document.getElementById('searchError');
        const resultBox = document.getElementById('searchResult');
        const query = input.value.trim();
        errorBox.style.display = 'none'; resultBox.style.display = 'none';
        if (!query) { errorBox.textContent = '请输入完整基金代码或名称'; errorBox.style.display = 'block'; return; }
        button.disabled = true; button.textContent = '正在计算…';
        try {
            const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.detail || '搜索失败');
            resultBox.innerHTML = renderSearchResult(payload); resultBox.style.display = 'block';
        } catch (error) { errorBox.textContent = error.message; errorBox.style.display = 'block'; }
        finally { button.disabled = false; button.textContent = '查询估值'; }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
    document.getElementById('searchBtn').addEventListener('click', searchFund);
    document.getElementById('searchInput').addEventListener('keydown', event => { if (event.key === 'Enter') searchFund(); });
    loadDashboard();
    setInterval(loadDashboard, 60000);
</script>
</body>
</html>
